services:
  db:
    image: postgres:16-alpine
    container_name: music-almanac-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-music_almanac}
      POSTGRES_USER: ${POSTGRES_USER:-music_almanac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-music_almanac} -d ${POSTGRES_DB:-music_almanac}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: music-almanac-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
